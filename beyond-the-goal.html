
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Beyond the goal</title>

    <link rel="stylesheet"
          href="beyond-the-goal.css">
</head>

<body>

    <div class="game-container">

        <!-- タイトル -->
        <h1>Beyond the goal</h1>

        <p class="subtitle">
            ゴールのその先へ
        </p>

        <!-- ゲーム画面 -->
        <canvas
            id="gameCanvas"
            width="960"
            height="500">
        </canvas>

        <!-- 操作説明 -->
        <div class="game-info">

            <h2>操作方法</h2>

            <p>
                <span>F</span>：ゲームスタート
            </p>

            <p>
                <span>W</span>：移動速度アップ
            </p>

            <p>
                <span>A</span> / <span>D</span>：左右移動
            </p>

            <p>
                <span>S</span>：移動
            </p>

            <p>
                <span>SPACE</span>：ジャンプ
            </p>

            <p>
                <span>Q</span>：スイッチを押す
            </p>

            <p>
                <span>E</span>：ドアを開ける
            </p>

            <p>
                <span>R</span>：カメラ反転
            </p>

            <p>
                <span>ESC</span>：タイトルへ戻る
            </p>

            <hr>

            <a href="index.html"
               class="back-button">
                PORTFOLIOへ戻る
            </a>

        </div>

    </div>

    <script src="beyond-the-goal.js"></script>

</body>

</html>
