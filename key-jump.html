<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Key Jump</title>

    <link rel="stylesheet" href="key-jump.css">
</head>

<body>

    <div class="game-container">

        <h1>Key Jump</h1>

        <p>
            敵を避けながらゴールを目指そう！
        </p>

        <canvas
            id="gameCanvas"
            width="950"
            height="500">
        </canvas>

        <div class="game-info">

            <p>
                ← →：移動　
                W：移動速度アップ　
                SPACE：ジャンプ
            </p>

            <p>
                タイトル：Qキーでスタート　
                クリア後：Tキーでタイトルへ
            </p>

            <a href="index.html">
                PORTFOLIOへ戻る
            </a>

        </div>

    </div>

    <script src="key-jump.js"></script>

</body>

</html>
