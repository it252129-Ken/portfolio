<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Key Jump</title>

    <link rel="stylesheet" href="key-jump.css">
</head>

<body>

    <div class="game-container">

        <h1>Key Jump</h1>

        <p>
            敵を避けながらゴールを目指そう！
        </p>

        <canvas
            id="gameCanvas"
            width="960"
            height="500">
        </canvas>


        <!-- スマホ操作ボタン -->
<div class="mobile-controls">

    <div class="move-buttons">
        <button data-key="ArrowLeft">◀</button>
        <button data-key="ArrowRight">▶</button>
    </div>

    <div class="action-buttons">
        <button data-key="KeyW">速</button>
        <button data-key="Space">JUMP</button>
    </div>

</div>

<!-- スマホ用シーン操作 -->
<div class="mobile-scene-controls">

   <div class="mobile-scene-controls">

    <button data-key="KeyQ">START</button>

    <button data-key="KeyE">HOW TO PLAY</button>

    <button data-key="KeyR">RETRY</button>

    <button data-key="KeyT">TITLE</button>

</div>
</div>        

        <div class="game-info">

            <p>
                ← →：移動　
                W：移動速度アップ　
                SPACE：ジャンプ
            </p>

            <p>
                タイトル：Qキーでスタート　
                クリア後：Rキーで再戦  Tキーでタイトルへ
            </p>

            <a href="index.html">
                PORTFOLIOへ戻る
            </a>

        </div>

    </div>

    <script src="key-jump.js"></script>

</body>

</html>
