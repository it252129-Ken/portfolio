
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHRONICLES OF FOURIA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         タイトル画面
    ========================== -->
    <section id="title-screen" class="screen title-screen">

        <div class="title-content">

            <h1>CHRONICLES OF FOURIA</h1>

            <p>四つの大地を巡る、英雄たちの物語</p>

            <button id="start-button">
                GAME START
            </button>

        </div>

    </section>


    <!-- =========================
         マップ選択画面
    ========================== -->
    <section id="map-screen" class="screen hidden">

        <h1>SELECT MAP</h1>

        <p>冒険する地域を選択してください</p>

        <div id="map-container">

            <button class="map-card" data-map="grassland">

                <img src="Resource/Map1.png"
                     alt="緑の平原">

                <h2>緑の平原</h2>

                <p>難易度：★☆☆☆</p>

                <p>穏やかな草原に魔物が現れた。</p>

            </button>


            <button class="map-card" data-map="volcano">

                <img src="Resource/Map2.png"
                     alt="灼熱の火山">

                <h2>灼熱の火山</h2>

                <p>難易度：★★☆☆</p>

                <p>灼熱の大地に強力な魔物が潜む。</p>

            </button>


            <button class="map-card" data-map="snow">

                <img src="Resource/Map3.png"
                     alt="氷結の雪山">

                <h2>氷結の雪山</h2>

                <p>難易度：★★★☆</p>

                <p>凍てつく雪山には危険な敵が待ち受ける。</p>

            </button>


            <button class="map-card" data-map="castle">

                <img src="Resource/Map4.png"
                     alt="暗黒の古城">

                <h2>暗黒の古城</h2>

                <p>難易度：★★★★</p>

                <p>最奥には恐ろしい魔物が待ち構えている。</p>

            </button>

        </div>

        <button id="map-back-button">
            戻る
        </button>

    </section>


    <!-- =========================
         戦闘画面
    ========================== -->
    <section id="battle-screen" class="screen hidden">

        <h1 id="battle-map-name">BATTLE</h1>


        <!-- 戦闘フィールド -->
        <div id="battle-container">

            <canvas id="battle-canvas"
                    width="960"
                    height="540">

                お使いのブラウザはCanvasに対応していません。

            </canvas>

        </div>


        <!-- 戦闘メッセージ -->
        <div id="battle-message">
            戦闘開始！
        </div>


        <!-- 味方ステータス -->
        <section id="party-area">

            <h2>PARTY</h2>

            <div id="party-status">

                <div id="swordsman-status"
                     class="character-status">

                    <h3>剣士</h3>

                    <p>HP：
                        <span id="swordsman-hp">150</span>
                    </p>

                    <p>MP：
                        <span id="swordsman-mp">30</span>
                    </p>

                </div>


                <div id="mage-status"
                     class="character-status">

                    <h3>魔法使い</h3>

                    <p>HP：
                        <span id="mage-hp">90</span>
                    </p>

                    <p>MP：
                        <span id="mage-mp">80</span>
                    </p>

                </div>


                <div id="priest-status"
                     class="character-status">

                    <h3>僧侶</h3>

                    <p>HP：
                        <span id="priest-hp">110</span>
                    </p>

                    <p>MP：
                        <span id="priest-mp">70</span>
                    </p>

                </div>


                <div id="archer-status"
                     class="character-status">

                    <h3>弓使い</h3>

                    <p>HP：
                        <span id="archer-hp">100</span>
                    </p>

                    <p>MP：
                        <span id="archer-mp">40</span>
                    </p>

                </div>

            </div>

        </section>


        <!-- 敵ステータス -->
        <section id="enemy-area">

            <h2>ENEMIES</h2>

            <div id="enemy-status">

                <p>敵がまだ出現していません。</p>

            </div>

        </section>


        <!-- コマンド -->
        <section id="command-area">

            <h2>COMMAND</h2>

            <div id="command-container">

                <button id="attack-button">
                    こうげき
                </button>

                <button id="skill-button">
                    スキル
                </button>

                <button id="defend-button">
                    ぼうぎょ
                </button>

                <button id="item-button">
                    アイテム
                </button>

            </div>

        </section>


        <!-- 戦闘ログ -->
        <section id="battle-log-area">

            <h2>BATTLE LOG</h2>

            <div id="battle-log">

                <p>冒険が始まります。</p>

            </div>

        </section>

    </section>


    <!-- =========================
         結果画面
    ========================== -->
    <section id="result-screen" class="screen hidden">

        <div class="result-content">

            <h1 id="result-title">
                VICTORY!
            </h1>

            <p id="result-description">
                戦闘結果
            </p>

            <button id="result-map-button">
                マップ選択へ戻る
            </button>

            <button id="result-title-button">
                タイトルへ戻る
            </button>

        </div>

    </section>


    <!-- =========================
         JavaScript
    ========================== -->
    <script type="module" src="main.js"></script>

</body>

</html>
